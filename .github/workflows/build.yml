name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRIMACE_COMMIT: 5120250dd63d8e5c8c1bae3335998ead9d1fc810
      LLVM_RELEASE: v3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: grimace-sdk/grimace
          ref: ${{ env.GRIMACE_COMMIT }}
          path: grimace

      - name: Install CMake and mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake mtools

      - name: Download the Windows CE LLVM
        run: |
          name=velo-llvm-$LLVM_RELEASE-linux-x86_64
          url=https://github.com/grimace-sdk/llvm-builds/releases/download/$LLVM_RELEASE
          curl -fsSLO $url/$name.tar.xz
          curl -fsSLO $url/$name.tar.xz.sha256
          sha256sum -c $name.tar.xz.sha256
          tar xf $name.tar.xz -C "$RUNNER_TEMP"
          echo "GRIMACE_LLVM=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: Build hlux and its card image, with no warnings
        run: |
          make card GRIMACE="$GITHUB_WORKSPACE/grimace" GRIMACE_LLVM="$GRIMACE_LLVM" 2>&1 | tee build.log
          ! grep -i "warning:" build.log

      - name: Package
        run: |
          version=${GITHUB_REF_NAME//\//-}
          mkdir dist
          cp build/ce2-sh3/hlux.exe "dist/hlux-$version-sh3-ce2.exe"
          (cd build && zip -9 "../dist/hlux-$version-card.zip" hlux.img)

      - uses: actions/upload-artifact@v7
        with:
          name: hlux
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hlux
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            *.exe
            *.zip
